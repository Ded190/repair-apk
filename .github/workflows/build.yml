name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool libltdl-dev pkg-config zlib1g-dev libffi-dev libssl-dev ccache

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.android
          key: repaircalc-signing-v1

      - name: Install build tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install cython==0.29.36 buildozer

      - name: Build APK
        run: |
          echo "pip<26" > /tmp/pip-constraint.txt
          export PIP_CONSTRAINT=/tmp/pip-constraint.txt
          yes | buildozer -v android debug > build.log 2>&1

      - name: Show last error lines
        if: failure()
        run: |
          echo "===== ПОСЛЕДНИЕ 400 СТРОК ЛОГА СБОРКИ ====="
          tail -n 400 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: repaircalc-apk
          path: bin/*.apk
