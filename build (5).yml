name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: ~/.android
          key: repaircalc-signing-v1

      - name: Install tools
        run: |
          python -m pip install --upgrade "pip<26" setuptools wheel
          python -m pip install cython==0.29.36 buildozer

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: repaircalc-apk
          path: bin/*.apk

      - name: Show log tail on failure
        if: failure()
        run: |
          LOG=$(find .buildozer -name "*.log" -type f 2>/dev/null | xargs -r ls -t 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            echo "===== ХВОСТ ЛОГА: $LOG ====="
            tail -n 400 "$LOG"
          else
            echo "===== лог не найден, последние строки вывода сборки ====="
            find .buildozer -type f -name "*.log" | head -5 || true
          fi
